# Optional: run PostgreSQL locally with Docker when you outgrow the SQLite dev file.
# Start it with:  docker compose up -d
# Then set in .env:  DATABASE_URL="postgresql://brilla:brilla@localhost:5432/brilla?schema=public"
# and switch the provider in prisma/schema.prisma to "postgresql" (see docs/DEPLOYMENT.md).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brilla
      POSTGRES_PASSWORD: brilla
      POSTGRES_DB: brilla
    ports:
      - "5432:5432"
    volumes:
      - brilla_pgdata:/var/lib/postgresql/data

volumes:
  brilla_pgdata:
